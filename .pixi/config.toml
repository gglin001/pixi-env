default-channels = ["conda-forge"]

[mirrors]
# https://pixi.sh/dev/reference/pixi_configuration/
# redirect all requests for conda-forge to the prefix.dev mirror
# prefix and conda support CEP 16
"https://conda.anaconda.org/conda-forge" = [
  # "oci://ghcr.io/channel-mirrors/conda-forge",
  # "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge",
  "https://mirror.nju.edu.cn/anaconda/cloud/conda-forge/",
  "https://mirrors.pku.edu.cn/anaconda/cloud/conda-forge/",
  "http://mirrors.cernet.edu.cn/anaconda/cloud/conda-forge",
  "https://conda.anaconda.org/conda-forge",
  "https://prefix.dev/conda-forge",
]
"https://conda.anaconda.org/conda-forge/label" = [
  "https://conda.anaconda.org/conda-forge/label",
]
"https://pypi.org/simple" = [
  "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple",
]

[pypi-config]
# Main index url
# index-url = "https://pypi.org/simple"
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
# list of additional urls
# extra-index-urls = ["https://pypi.org/simple2"]
# can be "subprocess" or "disabled"
# keyring-provider = "subprocess"
# allow insecure connections to host
# allow-insecure-host = ["localhost:8080"]
