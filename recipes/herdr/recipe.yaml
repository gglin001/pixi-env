context:
  version: "0.9.1"

package:
  name: herdr
  version: ${{ version }}

source:
  git: ssh://git@github.com/herdrdev/herdr.git
  tag: v${{ version }}
  depth: 1

build:
  number: 0
  script:
    - export ZIG="$BUILD_PREFIX/bin/zig"
    # Keep proc-macro dylibs loadable: conda's macOS strip can misalign LINKEDIT.
    - export CARGO_PROFILE_RELEASE_STRIP="none"
    # Rattler refreshes SRC_DIR on every build, while BUILD_DIR is stable when
    # scripts/build.sh uses --no-build-id and --keep-build. Keeping Cargo's
    # target directory here makes repeat builds incremental.
    - export CARGO_TARGET_DIR="$BUILD_DIR/cargo-target/${target_platform}"
    # libghostty-vt is built by Zig from build.rs. Its default local cache sits
    # inside SRC_DIR, and rattler's isolated HOME puts the global cache there
    # too. Both would otherwise be discarded on every build.
    - export ZIG_LOCAL_CACHE_DIR="$BUILD_DIR/zig-local-cache/${target_platform}"
    - export ZIG_GLOBAL_CACHE_DIR="$BUILD_DIR/zig-global-cache/${target_platform}"
    - export LIBGHOSTTY_VT_OPTIMIZE="ReleaseFast"
    - export LIBGHOSTTY_VT_SIMD="true"
    - |
      persistent_src="$BUILD_DIR/source-cache/${target_platform}"
      mkdir -p "$persistent_src"
      "$BUILD_PREFIX/bin/rsync" \
        --archive \
        --checksum \
        --delete \
        --no-times \
        --omit-dir-times \
        --exclude '/.cache/' \
        --exclude '/.source_info.json' \
        --exclude '/build_env.sh' \
        --exclude '/conda_build.log' \
        --exclude '/conda_build.sh' \
        --exclude '/vendor/libghostty-vt/zig-out/' \
        "$SRC_DIR/" "$persistent_src/"
    - '"$BUILD_PREFIX/bin/cargo" install --locked --no-track --force --root "$PREFIX" --path "$persistent_src" --bin herdr'

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - rsync
    - zig ==0.16.0

tests:
  - script:
      - test "$(herdr --version)" = "herdr ${{ version }}"

about:
  homepage: https://herdr.dev
  license: Apache-2.0
  license_file: LICENSE
  summary: Terminal workspace manager for AI coding agents
