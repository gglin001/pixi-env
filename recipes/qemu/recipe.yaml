context:
  version: "11.1.1"

package:
  name: qemu
  version: ${{ version }}

source:
  # Equivalent to git@github.com:qemu/qemu.git; rattler requires an SSH URL.
  # git: ssh://git@github.com/qemu/qemu.git
  git: https://mirrors.tuna.tsinghua.edu.cn/git/qemu.git
  branch: stable-11.1
  depth: 1
  # Use the bundled firmware binaries; do not fetch all firmware source trees.
  submodules: false

build:
  number: 1
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - make
    - ninja
    - flex
    - bison
    - meson >=1.5
    - pkg-config
    - python >=3.10
    - pip
    - python-build
    - setuptools
    - wheel
    - git
    - rsync
    - dtc >=1.5.1
  host:
    - glib >=2.66
    - pixman
    - zlib
    - libslirp >=4.7
    - libfdt >=1.5.1

tests:
  - script:
      - qemu-system-x86_64 --version
      - qemu-system-aarch64 --version
      - qemu-system-xtensa --version
      - qemu-img create -f qcow2 test.qcow2 1M
      - qemu-img check test.qcow2
      - test -s "$PREFIX/share/qemu/edk2-aarch64-code.fd"
      - test -s "$PREFIX/share/qemu/edk2-arm-vars.fd"
      - test -s "$PREFIX/share/qemu/firmware/60-edk2-aarch64.json"
      - echo quit | qemu-system-aarch64 -machine virt -accel tcg -cpu max -bios edk2-aarch64-code.fd -S -display none -serial none -monitor stdio
      - if: osx and arm64
        then: echo quit | qemu-system-aarch64 -machine virt -accel hvf -cpu host -bios edk2-aarch64-code.fd -S -display none -serial none -monitor stdio
      - if: linux
        then: qemu-x86_64 --version

about:
  homepage: https://www.qemu.org/
  repository: https://github.com/qemu/qemu
  license: GPL-2.0-only
  license_file:
    - COPYING
    - LICENSE
    - pc-bios/edk2-licenses.txt
  summary: Generic machine emulator and virtualizer
